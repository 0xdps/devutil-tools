<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f15" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LocalPlus" />
    <link rel="mask-icon" href="/logo.svg" color="#1a1b26" />

    <meta name="author" content="Devendra Pratap Singh" />
    <!-- Per-route title, description, canonical, social tags and JSON-LD are
         injected at build time from src/tools/catalog.ts (see vite-plugins/static-routes.ts). -->
    <!--seo:start--><!--seo:end-->

    <script>
      // Moved from devutil.codes: forward old bookmarks and share links (keeps path, query and #fragment).
      // A server-side 301 on the old domain is preferred; this is the fallback.
      (function () {
        var h = location.hostname;
        if (h === 'devutil.codes' || h === 'www.devutil.codes') {
          location.replace('https://localplus.app' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <script>
      // Apply the saved theme before first paint (mirrors ThemeProvider).
      (function () {
        try {
          var t = localStorage.getItem('devutil-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      #root { min-height: 100vh; }
      body { margin: 0; background-color: #fbfbfd; }
      html.dark body { background-color: #0e0f15; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Anately Analytics Tracking -->
    <script
      defer
      src="https://assets.0xlabs.space/anately.js"
      data-website-id="c1ecfe71-2795-4b1c-8253-d9d64fc797e7"
      data-host-url="https://analytics.0xlabs.space"
    ></script>

  </body>
</html>
